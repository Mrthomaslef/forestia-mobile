<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Forestia" />
  <meta name="theme-color" content="#030905" />
  <title>Forestia (1998) — Moteur ScummVM Director (Mac)</title>
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icon.svg" />
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg-void: #030905;
      --card-bg: rgba(9, 26, 15, 0.9);
      --border-green: rgba(74, 222, 128, 0.28);
      --accent: #22c55e;
      --text-main: #ecfdf5;
      --text-muted: #86efac;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100dvh;
      width: 100%;
      overflow-x: hidden;
      background: radial-gradient(circle at 50% 35%, #0e2917 0%, var(--bg-void) 72%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior-y: contain;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(28px, calc(env(safe-area-inset-bottom) + 16px));
    }

    /* Pull-to-Refresh: circular SVG arrow ONLY, zero text */
    #ptr-indicator {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translate(-50%, -24px);
      width: 34px;
      height: 34px;
      border-radius: 999px;
      background: rgba(9, 28, 16, 0.94);
      border: 1px solid var(--border-green);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.55);
      transition: opacity 0.15s ease;
    }
    #ptr-indicator svg {
      width: 18px;
      height: 18px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    #ptr-indicator.spinning svg {
      animation: spin 0.65s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .boot-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }

    .emblem-wrap {
      position: relative;
      width: 78px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .emblem-wrap img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
    }
    .ring {
      position: absolute;
      inset: 0;
      border-radius: 22px;
      border: 2px solid rgba(34, 197, 94, 0.25);
      border-top-color: var(--accent);
      animation: spin 1.1s linear infinite;
    }

    .status-line {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      margin: 0;
    }

    .fallback-box {
      display: none;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-green);
      border-radius: 16px;
      padding: 16px;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
    }
    .fallback-box.visible {
      display: flex;
    }
    .fallback-box p {
      margin: 0;
      font-size: 13px;
      line-height: 1.45;
      color: #d1fae5;
    }
    .lan-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      padding: 0 18px;
      border-radius: 12px;
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid rgba(74, 222, 128, 0.45);
      color: var(--text-main);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      touch-action: manipulation;
      transition: background 0.15s ease;
    }
    .lan-cta:hover {
      background: rgba(34, 197, 94, 0.28);
    }
    .lan-cta svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div id="ptr-indicator" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <path d="M21 12a9 9 0 1 1-2.64-6.36" />
      <polyline points="21 3 21 9 15 9" />
    </svg>
  </div>

  <main class="boot-center">
    <div class="emblem-wrap">
      <div class="ring"></div>
      <img src="assets/icon.svg" alt="Forestia" />
    </div>
    <p class="status-line" id="status-line">Ouverture directe de Forestia…</p>

    <div class="fallback-box" id="fallback-box">
      <p id="fallback-msg">En attente du serveur ScummVM hébergé sur le Mac… Nouvel essai automatique toutes les 3 secondes.</p>
      <a class="lan-cta" id="lan-link" href="http://192.168.1.111:8791/">
        <svg viewBox="0 0 24 24">
          <path d="M5 12.55a11 11 0 0 1 14.08 0" />
          <path d="M1.42 9a16 16 0 0 1 21.16 0" />
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
          <circle cx="12" cy="20" r="1" fill="currentColor" />
        </svg>
        <span>Ouvrir sur le Wi-Fi local (Mac)</span>
      </a>
    </div>
  </main>

  <script src="endpoint.js"></script>
  <script>
    (function () {
      const CACHE_KEY = "forestia-scummvm-mac-v1";
      try {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then((regs) => {
            regs.forEach((r) => r.unregister());
          });
        }
        if (localStorage.getItem("forestia_cache_key") !== CACHE_KEY && "caches" in window) {
          caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
          localStorage.setItem("forestia_cache_key", CACHE_KEY);
        }
      } catch (_) {}

      const statusLine = document.getElementById("status-line");
      const fallbackBox = document.getElementById("fallback-box");
      const lanLink = document.getElementById("lan-link");

      async function probeHealth(baseUrl, timeoutMs) {
        if (!baseUrl) return false;
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), timeoutMs);
        try {
          const res = await fetch(baseUrl.replace(/\/$/, "") + "/api/health?t=" + Date.now(), {
            signal: ctrl.signal,
            cache: "no-store"
          });
          clearTimeout(t);
          if (!res.ok) return false;
          const data = await res.json();
          return !!(data && data.ok && data.engine === "scummvm-director-wasm");
        } catch (_) {
          clearTimeout(t);
          return false;
        }
      }

      async function loadEndpoint() {
        try {
          const res = await fetch("endpoint.json?t=" + Date.now(), { cache: "no-store" });
          if (res.ok) {
            return await res.json();
          }
        } catch (_) {}
        return window.FORESTIA_ENDPOINT || {
          lanUrl: "http://192.168.1.111:8791",
          tunnelUrl: ""
        };
      }

      async function connectAndLaunch() {
        const ep = await loadEndpoint();
        const lanUrl = (ep && ep.lanUrl) || "http://192.168.1.111:8791";
        const tunnelUrl = (ep && ep.tunnelUrl) || "";
        const hash = window.location.hash || "";

        lanLink.href = lanUrl.replace(/\/$/, "") + "/" + hash;

        // When opened over HTTP or file://, prefer ultra-fast local Wi-Fi LAN if reachable
        if (window.location.protocol !== "https:") {
          if (await probeHealth(lanUrl, 500)) {
            window.location.replace(lanUrl.replace(/\/$/, "") + "/" + hash);
            return true;
          }
        }

        // Check Cloudflare HTTPS tunnel (works on 4G/5G and Wi-Fi from HTTPS GitHub Pages)
        if (tunnelUrl && await probeHealth(tunnelUrl, 3200)) {
          window.location.replace(tunnelUrl.replace(/\/$/, "") + "/" + hash);
          return true;
        }

        statusLine.textContent = "Connexion au Mac en cours…";
        fallbackBox.classList.add("visible");
        return false;
      }

      async function bootLoop() {
        const ok = await connectAndLaunch();
        if (!ok) {
          setTimeout(bootLoop, 3000);
        }
      }
      bootLoop();

      // Pull-to-Refresh (Touch + Mouse, circular SVG arrow ONLY)
      const ptr = document.getElementById("ptr-indicator");
      const ptrSvg = ptr.querySelector("svg");
      let startY = null;
      let dist = 0;
      const THRESHOLD = 68;

      const onStart = (y) => {
        if (window.scrollY <= 0) {
          startY = y;
          dist = 0;
        }
      };
      const onMove = (y) => {
        if (startY === null) return;
        dist = Math.max(0, y - startY);
        if (dist > 6) {
          const p = Math.min(1, dist / THRESHOLD);
          ptr.style.opacity = String(p);
          ptr.style.transform = `translate(-50%, ${Math.min(36, dist * 0.45) - 16}px)`;
          ptrSvg.style.transform = `rotate(${Math.round(p * 300)}deg)`;
        }
      };
      const onEnd = () => {
        if (startY === null) return;
        if (dist >= THRESHOLD) {
          if (navigator.vibrate) navigator.vibrate(12);
          ptr.style.opacity = "1";
          ptr.style.transform = "translate(-50%, 14px)";
          ptr.classList.add("spinning");
          location.reload();
        } else {
          ptr.style.opacity = "0";
          ptr.style.transform = "translate(-50%, -24px)";
        }
        startY = null;
        dist = 0;
      };

      window.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) onStart(e.touches[0].clientY);
      }, { passive: true });
      window.addEventListener("touchmove", (e) => {
        if (e.touches.length === 1) onMove(e.touches[0].clientY);
      }, { passive: true });
      window.addEventListener("touchend", onEnd, { passive: true });
      window.addEventListener("touchcancel", onEnd, { passive: true });

      window.addEventListener("mousedown", (e) => {
        if (e.clientY <= 90) onStart(e.clientY);
      });
      window.addEventListener("mousemove", (e) => onMove(e.clientY));
      window.addEventListener("mouseup", onEnd);
    })();
  </script>
</body>
</html>
